name: Login Ptt daily

on:
  # schedule:
  #   - cron: '0 0 * * *'
  
  workflow_dispatch:
  
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install expect
        run: sudo apt-get update && sudo apt-get install -y expect

      - name: Run login script
        run: |
          chmod +x login-ptt.exp
          ./login-ptt.exp
        env:
          PTT_USER: ${{ secrets.PTT_ACCOUNT }}
          PTT_PASS: ${{ secrets.PTT_PASSWORD }}
